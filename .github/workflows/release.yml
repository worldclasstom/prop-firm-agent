# Publishes a GitHub Release when a merged commit on main carries a package version
# that has no tag yet. Nobody pushes tags by hand: bump pyproject.toml and
# propfirm/__init__.py together, merge, and the Release appears after the tests pass.
name: Release
on:
  push:
    branches: [main]
    paths: [pyproject.toml, propfirm/__init__.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Derive the tag from the package version
        id: version
        run: |
          python scripts/release_tag.py > release.json
          echo "tag=$(python -c 'import json;print(json.load(open("release.json"))["tag"])')" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(python -c 'import json;print(str(json.load(open("release.json"))["prerelease"]).lower())')" >> "$GITHUB_OUTPUT"
      - name: Check whether the tag already exists
        id: exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} already exists; nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the offline checks before releasing
        if: steps.exists.outputs.exists == 'false'
        run: |
          python -m pip install --quiet .
          python -m unittest discover -s tests
          propfirm doctor
      - name: Publish the Release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          {
            echo "Pinned release of the Prosperity Labs Agent Kit. Read STATUS.md for observed evidence and remaining acceptance before installing."
            echo
            echo "Install: \`git clone --branch $TAG https://github.com/${GITHUB_REPOSITORY}.git\` or \`pip install git+https://github.com/${GITHUB_REPOSITORY}.git@$TAG\`"
            echo
          } > notes.md
          PRERELEASE=""
          [ "${{ steps.version.outputs.prerelease }}" = "true" ] && PRERELEASE="--prerelease"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md --generate-notes $PRERELEASE
          echo "Published $TAG at $GITHUB_SHA"
