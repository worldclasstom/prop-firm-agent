# Scheduled execution of the Prosperity Labs Agent Kit (docs/SCHEDULED-EXECUTION.md).
# Copy this directory into a PRIVATE repository you own. The API key is a repository
# secret named PROPR_API_KEY. The private state directory agent-home/ is committed back
# after every run so reports stay readable and state survives between runs.
name: Trading agent
on:
  schedule:
    - cron: '10 * * * *'   # every hour at :10 UTC; the 00:10 run performs the daily scan
  workflow_dispatch:
    inputs:
      command:
        description: 'tick (trade when rules signal) or check (read-only runtime evidence)'
        default: 'tick'
        type: choice
        options: [tick, check]
permissions:
  contents: write
concurrency:
  group: trading-agent
  cancel-in-progress: false
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROPFIRM_HOME: ${{ github.workspace }}/agent-home
      PROPR_API_KEY: ${{ secrets.PROPR_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the pinned kit release
        run: python -m pip install --quiet "git+https://github.com/worldclasstom/prop-firm-agent.git@v0.2.0-beta.9"
      - name: Read-only runtime check
        if: inputs.command == 'check'
        run: |
          propfirm doctor
          propfirm markets > /dev/null && echo "Hyperliquid public metadata reachable"
          propfirm accounts > /dev/null && echo "Propr authenticated read reachable"
          echo "Check completed from scheduler context $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Tick
        id: tick
        if: inputs.command == 'tick' || github.event_name == 'schedule'
        continue-on-error: true
        run: propfirm tick
      - name: Commit state and reports
        if: inputs.command == 'tick' || github.event_name == 'schedule'
        run: |
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          git add agent-home
          git diff --cached --quiet || git commit -m "tick $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
      - name: Surface a failed or halted tick
        if: steps.tick.outcome == 'failure'
        run: |
          echo "::error::propfirm tick exited non-zero. Read agent-home/status.json and the latest report before the next run."
          exit 1
