[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prosperity-prop-firm-agent"
version = "0.1.0a1"
description = "Prosperity Labs Propr agent development kit"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
propfirm = "propfirm.__main__:main"

[tool.setuptools]
packages = ["propfirm"]
